<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>云图行业内容榜单分析报告</title>
  <style>$style</style>
</head>
<body>
  <a class="skip-link" href="#report-content">跳至报告正文</a>
  <main class="page">
    <header class="report-cover"><p>云图行业内容策略</p><h1>行业内容榜单分析</h1><p>$subtitle</p></header>
    <div class="report-shell">
      <nav class="report-nav" aria-label="报告目录"><small>报告目录</small><a href="#top-material-combination" aria-current="location">01｜TOP 素材组合结论</a><a href="#audience-insights">02｜人群洞察</a></nav>
      <div class="report-content" id="report-content">
        <section class="section" id="top-material-combination"><header class="section-header"><div><h2>01｜TOP 素材组合结论</h2><p>基于筛选品牌集合与标题匹配品牌的曝光 TOP30，归纳数据、人群与营销卖点结构。</p></div>$source_list</header>$top_material_combination</section>
        $audience_insights
      </div>
    </div>
  </main>
  <noscript><style>.brand-panel[hidden]{display:block!important}</style></noscript>
  <script>
    (function () {
      var tabs = document.querySelectorAll('[data-brand-tab]');
      if (tabs.length) {

      function activate(tab, focus) {
        for (var index = 0; index < tabs.length; index += 1) {
          var candidate = tabs[index];
          var selected = candidate === tab;
          var panel = document.getElementById(candidate.getAttribute('data-brand-target'));
          candidate.setAttribute('aria-selected', selected ? 'true' : 'false');
          candidate.tabIndex = selected ? 0 : -1;
          if (panel) panel.hidden = !selected;
        }
        if (focus) tab.focus();
      }

      for (var index = 0; index < tabs.length; index += 1) {
        (function (tab, tabIndex) {
          tab.addEventListener('click', function () { activate(tab, false); });
          tab.addEventListener('keydown', function (event) {
            var direction = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
            if (event.key === 'Home' || event.key === 'End' || direction[event.key]) {
              event.preventDefault();
              var next = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : (tabIndex + direction[event.key] + tabs.length) % tabs.length;
              activate(tabs[next], true);
            }
          });
        }(tabs[index], index));
      }
      }

      var charts = document.querySelectorAll('[data-audience-pie]');
      for (var chartIndex = 0; chartIndex < charts.length; chartIndex += 1) {
        (function (chart) {
          var tooltip = chart.querySelector('.chart-tooltip');
          var slices = JSON.parse(chart.getAttribute('data-pie-slices') || '[]');
          function showTooltip(active) {
            tooltip.replaceChildren();
            var title = document.createElement('b');
            title.textContent = active.label;
            tooltip.append(title, document.createTextNode('素材数 ' + active.count + ' 条 · 覆盖率 ' + active.materialShare + '% · 归一化占比 ' + active.share + '%'));
            tooltip.classList.add('is-visible');
          }
          function updateTooltip(event) {
            var rect = chart.getBoundingClientRect();
            var dx = event.clientX - rect.left - rect.width / 2;
            var dy = event.clientY - rect.top - rect.height / 2;
            if (Math.sqrt(dx * dx + dy * dy) > Math.min(rect.width, rect.height) / 2) return;
            var angle = (Math.atan2(dy, dx) + Math.PI / 2 + Math.PI * 2) % (Math.PI * 2) * 180 / Math.PI;
            var active = slices.find(function (slice) { return angle >= slice.start && angle < slice.end; }) || slices[slices.length - 1];
            if (!active) return;
            showTooltip(active);
          }
          chart.addEventListener('pointerenter', updateTooltip);
          chart.addEventListener('pointermove', updateTooltip);
          chart.addEventListener('pointerleave', function () { tooltip.classList.remove('is-visible'); });
          chart.addEventListener('focus', function () {
            if (!slices[0]) return;
            showTooltip(slices[0]);
          });
          chart.addEventListener('blur', function () { tooltip.classList.remove('is-visible'); });
        }(charts[chartIndex]));
      }
    }());
  </script>
</body>
</html>
